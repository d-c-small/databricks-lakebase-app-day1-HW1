{% extends "base.html" %}

{% block title %}New Ticket — Lakebase Support{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('index') }}">All Tickets</a></li>
                <li class="breadcrumb-item active">New Ticket</li>
            </ol>
        </nav>

        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">
                    <i class="bi bi-plus-circle me-2"></i>Create a New Ticket
                </h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('new_ticket') }}" novalidate>

                    <div class="mb-4">
                        <label for="title" class="form-label fw-medium">
                            Title <span class="text-danger">*</span>
                        </label>
                        <input type="text"
                               class="form-control"
                               id="title"
                               name="title"
                               value="{{ form_data.title }}"
                               placeholder="Briefly describe the issue"
                               maxlength="200"
                               required
                               autofocus>
                        <div class="form-text">Maximum 200 characters.</div>
                    </div>

                    <div class="mb-4">
                        <label for="created_by" class="form-label fw-medium">
                            Your Name <span class="text-danger">*</span>
                        </label>
                        <input type="text"
                               class="form-control"
                               id="created_by"
                               name="created_by"
                               value="{{ form_data.created_by }}"
                               placeholder="Enter your name"
                               maxlength="100"
                               required>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-ticket me-1"></i>Create Ticket
                        </button>
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </div>

                </form>
            </div>
        </div>

    </div>
</div>

{% endblock %}
